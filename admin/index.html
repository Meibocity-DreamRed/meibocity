<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://app.pagescms.org">
  <title>CMS Login | Meibo City</title>
  <meta name="description" content="Meibo City CMS login - redirecting to the content management system.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a1a;
      background-image:
        radial-gradient(ellipse at 30% 40%, rgba(201, 169, 110, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(201, 169, 110, 0.05) 0%, transparent 55%);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 3rem 2.5rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #c9a96e;
      margin-bottom: 0.75rem;
    }
    .divider {
      width: 70px;
      height: 3px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: 1.15rem;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }
    p {
      color: #b0b0b0;
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: #c9a96e;
      color: #1a1a1a;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .btn:hover {
      background: #d4b87a;
      transform: translateY(-2px);
    }
    .hint {
      margin-top: 1.4rem;
      font-size: 0.78rem;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MEIBO CITY</div>
    <div class="divider"></div>
    <h1>CMS Login</h1>
    <p>Redirecting you to the Meibo City content management system. If you are not redirected automatically, use the button below.</p>
    <a class="btn" href="https://app.pagescms.org">Open CMS</a>
    <p class="hint">https://app.pagescms.org</p>
  </div>
  <script>
    window.location.replace('https://app.pagescms.org');
  </script>
</body>
</html>
