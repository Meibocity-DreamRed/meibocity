media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: author
        label: Author
        type: string
        default: Guangzhou Meibo City
      - name: excerpt
        label: Excerpt
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Content
        type: rich-text
        required: true
    view:
      primary: title
      sort: date
      order: desc
